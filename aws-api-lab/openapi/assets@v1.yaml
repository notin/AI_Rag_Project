openapi: 3.0.3
info:
  title: Assets API
  version: 1.0.0
  description: |
    Contract-first CRUD over assets with async harvests.

    Versioning is `/v1` in the path. Additive changes do not bump the version.
    `/v1` maps cleanly to API Gateway stages and to routing/observability.

    Pagination is an opaque `nextCursor` (url-safe base64 of DynamoDB
    `LastEvaluatedKey`). Offset pagination is rejected: it breaks under
    concurrent writes, and DynamoDB has no real offset.

    Optimistic concurrency: `ETag` on GET (`W/"{version}"`); `If-Match` on
    PUT/PATCH/DELETE; `412` on mismatch.

    Errors are RFC 9457 `application/problem+json`. Clients branch on `code`,
    never on `detail`. Existence-sensitive resources return `404` rather than
    `403` so a caller cannot probe whether an id exists.

    GraphQL is out of scope. CRUD over well-known resources with cacheable
    GETs does not need it; REST keeps HTTP caching, CloudFront, and
    gateway-level auth.

    API keys (when a usage plan is attached) are identification for quota,
    not authentication.

x-error-codes:
  - code: ASSET_NOT_FOUND
    status: 404
    title: Asset not found
  - code: HARVEST_NOT_FOUND
    status: 404
    title: Harvest not found
  - code: JOB_NOT_FOUND
    status: 404
    title: Job not found
  - code: VALIDATION_FAILED
    status: 422
    title: Validation failed
  - code: BAD_CURSOR
    status: 422
    title: Invalid cursor
  - code: CONFLICT
    status: 409
    title: Conflict
  - code: PRECONDITION_FAILED
    status: 412
    title: Precondition failed
  - code: THROTTLED
    status: 429
    title: Too many requests
  - code: BAD_REQUEST
    status: 400
    title: Bad request
  - code: UNAUTHORIZED
    status: 401
    title: Unauthorized
  - code: FORBIDDEN
    status: 403
    title: Forbidden
  - code: INTERNAL
    status: 500
    title: Internal error

servers:
  - url: https://{apiId}.execute-api.us-east-2.amazonaws.com
    description: API Gateway REST API (stage is the environment, path stays /v1)
    variables:
      apiId:
        default: pending

tags:
  - name: Assets
    description: Caller-owned media assets. Existence-sensitive; unknown ids are 404.
  - name: Harvests
    description: Nested harvests under an asset. Create is async (202 + job).
  - name: Jobs
    description: Status resource for long-running creates. Poll GET /v1/jobs/{jobId}.

security:
  - bearerAuth: []

paths:
  /v1/assets:
    get:
      operationId: listAssets
      tags: [Assets]
      summary: List assets for the caller
      description: Cursor-paginated. Safe and cacheable. Authenticated lists use Cache-Control private.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createAsset
      tags: [Assets]
      summary: Create an asset
      description: POST is the only non-idempotent write. Idempotency-Key is required so a retry cannot double-create.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "201":
          description: Created
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getAsset
      tags: [Assets]
      summary: Get one asset
      description: Existence-sensitive. Unknown or unauthorized ids both return 404.
      responses:
        "200":
          description: Asset
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: replaceAsset
      tags: [Assets]
      summary: Replace an asset
      description: Idempotent full replace. If-Match is required.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetReplace"
      responses:
        "200":
          description: Replaced
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: patchAsset
      tags: [Assets]
      summary: Partially update an asset
      description: JSON Merge Patch (RFC 7396). If-Match is required.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AssetPatch"
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteAsset
      tags: [Assets]
      summary: Delete an asset
      description: Idempotent. If-Match is required. Repeat delete of a missing id is 404 (existence-sensitive), not 204.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/assets/{assetId}/harvests:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: listHarvests
      tags: [Harvests]
      summary: List harvests for an asset
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of harvests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarvestList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createHarvest
      tags: [Harvests]
      summary: Request an async harvest
      description: |
        Long-running create. Returns 202 and a job resource. The API Lambda
        publishes an event; a worker does the work. Clients poll GET /v1/jobs/{jobId}
        or wait for a later webhook. Do not Lambda-invoke the worker from this path.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarvestCreate"
      responses:
        "202":
          description: Accepted
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/jobs/{jobId}:
    get:
      operationId: getJob
      tags: [Jobs]
      summary: Get job status
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Coarse-grained authentication at the gateway. Object ownership is checked in the service.
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Identification for usage plans and quotas. Not authentication.

  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque nextCursor from the previous page. Not an offset. Invalid cursors are 422 BAD_CURSOR.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 256
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Must equal the ETag from GET. Weak tags of the form W/"{version}".
      schema:
        type: string
        example: W/"3"

  headers:
    ETag:
      description: Weak tag W/"{version}". Send back as If-Match on write.
      schema:
        type: string
        example: W/"3"
    Location:
      description: URL of the created resource or job.
      schema:
        type: string
        example: /v1/jobs/11111111-1111-4111-8111-111111111111

  responses:
    BadRequest:
      description: Malformed request (including a missing required header)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Missing, or existence-masked unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: State conflict (duplicate create, stale idempotency replay mismatch)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    PreconditionFailed:
      description: If-Match did not equal the current ETag
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unprocessable:
      description: Semantically invalid payload or cursor
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: Throttled
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: Unexpected error. detail is generic; the requestId is the support handle.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    ProblemDetail:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, requestId]
      properties:
        type:
          type: string
          format: uri
          description: RFC 9457 type URI. Documentation identifier; need not resolve.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Human-readable. Clients must not parse this.
        instance:
          type: string
        code:
          type: string
          enum:
            - ASSET_NOT_FOUND
            - HARVEST_NOT_FOUND
            - JOB_NOT_FOUND
            - VALIDATION_FAILED
            - BAD_CURSOR
            - CONFLICT
            - PRECONDITION_FAILED
            - THROTTLED
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - INTERNAL
        requestId:
          type: string

    Asset:
      type: object
      additionalProperties: false
      required: [assetId, ownerId, name, status, version, createdAt, updatedAt]
      properties:
        assetId:
          type: string
          format: uuid
        ownerId:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        status:
          $ref: "#/components/schemas/AssetStatus"
        version:
          type: integer
          minimum: 1
          description: Concurrency token. Serialized as ETag W/"{version}".
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssetStatus:
      type: string
      enum: [active, archived]

    AssetCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048

    AssetReplace:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        status:
          $ref: "#/components/schemas/AssetStatus"

    AssetPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        status:
          $ref: "#/components/schemas/AssetStatus"

    AssetList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        nextCursor:
          type: string
          nullable: true
          description: Opaque. Base64 of LastEvaluatedKey. Null when no further page.

    Harvest:
      type: object
      additionalProperties: false
      required: [harvestId, assetId, status, createdAt, updatedAt]
      properties:
        harvestId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/HarvestStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HarvestStatus:
      type: string
      enum: [pending, processing, succeeded, failed]

    HarvestCreate:
      type: object
      additionalProperties: false
      properties:
        profile:
          type: string
          maxLength: 64
          description: Optional worker profile. The API records it; it does not run the harvest.

    HarvestList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Harvest"
        nextCursor:
          type: string
          nullable: true

    Job:
      type: object
      additionalProperties: false
      required: [jobId, type, status, assetId, createdAt, updatedAt]
      properties:
        jobId:
          type: string
          format: uuid
        type:
          type: string
          enum: [harvest]
        status:
          $ref: "#/components/schemas/JobStatus"
        assetId:
          type: string
          format: uuid
        errorCode:
          type: string
          description: Catalog code when status is failed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobStatus:
      type: string
      enum: [pending, processing, succeeded, failed]
